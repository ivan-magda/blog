<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="360pt" height="612pt" viewBox="0 0 360 612" xmlns="http://www.w3.org/2000/svg" version="1.1" role="img" aria-labelledby="14-task-reuse-comparison-mobile-title 14-task-reuse-comparison-mobile-desc" xml:lang="en"><title id="14-task-reuse-comparison-mobile-title">Input cost and total process CPU</title><desc id="14-task-reuse-comparison-mobile-desc">Separate zero-based panels compare synchronous send cost and total process CPU for a 100,000-value burst. Medians of 15 rounds; CPU includes output and settling. Task per value versus long-lived task: 798 versus 216 ns/send, about 73% lower, and 280.81 versus 21.91 ms CPU, about 92% lower.</desc>

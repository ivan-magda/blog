<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="720" height="548" viewBox="0 0 720 548" role="img" aria-labelledby="task-timeline-dark-title task-timeline-dark-desc"><title id="task-timeline-dark-title">One input burst, two task policies</title><desc id="task-timeline-dark-desc">Illustrative trailing-debounce timing, not a captured trace. Inputs A, B and C each replace the pending value. A task per input requests cancellation of A and B; C runs after the quiet period. A single worker instead wakes at its original deadline, observes the extension, sleeps again, and runs C. Crosses denote cancellation requests, not immediate task completion.</desc><style id="embedded-site-font">@font-face{font-family:"Google Sans Code";src:url(data:font/woff2;base64,) format("woff2");font-weight:400 700;font-style:normal}</style><defs><marker id="task-timeline-dark-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#b0aaa1" stroke-width="1.2"/></marker></defs><rect width="720" height="548" fill="#242834"/><g font-family="'Google Sans Code', monospace"><text x="32" y="64" font-size="20" font-weight="400" fill="#e4dfd7" text-anchor="start">Input</text>
<path d="M164 56 H676" fill="none" stroke="#b0aaa1" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#task-timeline-dark-arrow)"/>
<circle cx="172" cy="56" r="4" fill="#e4dfd7"/>
<text x="172" y="36" font-size="20" font-weight="400" fill="#e4dfd7" text-anchor="middle">A</text>
<circle cx="252" cy="56" r="4" fill="#e4dfd7"/>
<text x="252" y="36" font-size="20" font-weight="400" fill="#e4dfd7" text-anchor="middle">B</text>
<circle cx="332" cy="56" r="4" fill="#e4dfd7"/>
<text x="332" y="36" font-size="20" font-weight="400" fill="#e4dfd7" text-anchor="middle">C</text>
<line x1="332" y1="96" x2="540" y2="96" stroke="#b0aaa1" stroke-width="1.5"/>
<line x1="332" y1="92" x2="332" y2="100" stroke="#b0aaa1" stroke-width="1.5"/>
<line x1="540" y1="92" x2="540" y2="100" stroke="#b0aaa1" stroke-width="1.5"/>
<text x="436" y="128" font-size="20" font-weight="400" fill="#b0aaa1" text-anchor="middle">Quiet period</text>
<text x="32" y="176" font-size="20" font-weight="600" fill="#e4dfd7" text-anchor="start">(a) Task per value</text>
<line x1="172" y1="192" x2="172" y2="340" stroke="#3d4155" stroke-width="1.5" stroke-dasharray="3 5"/>

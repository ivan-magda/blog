<text x="268" y="232" font-size="18" font-weight="400" fill="#69645e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cancel()</text>
<text x="32" y="284" font-size="20" font-weight="400" fill="#2c2825" text-anchor="start">Task B</text>

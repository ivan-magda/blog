<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="720" height="536" viewBox="0 0 720 536" role="img" aria-labelledby="05-runtime-profile-dark-title 05-runtime-profile-dark-desc"><title id="05-runtime-profile-dark-title">Runtime metadata and an opaque value representation</title><desc id="05-runtime-profile-dark-desc">Selected observed profile symbols accompany the conceptual relationship between state containing ContinuousClock.Instant, type metadata, and a value witness table supplying size, alignment, and value operations; the diagram does not represent a sampled call stack.</desc><defs><marker id="05-runtime-profile-dark-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#b0aaa1" stroke-width="1.2"/></marker><marker id="05-runtime-profile-dark-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#e09040" stroke-width="1.2"/></marker><marker id="05-runtime-profile-dark-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#b0aaa1" stroke-width="1.2"/></marker></defs><rect width="720" height="536" fill="#242834"/><text x="32" y="44" fill="#e4dfd7" font-size="20" font-weight="600" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Observed symbols</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="720" height="496" viewBox="0 0 720 496" role="img" aria-labelledby="09-storage-layout-dark-title 09-storage-layout-dark-desc"><title id="09-storage-layout-dark-title">Moving the lock within a ManagedBuffer allocation</title><desc id="09-storage-layout-dark-desc">Adjacent storage places the lock at the element-area base; padded storage reserves 128 bytes from that base before the lock, while keeping state in the header and increasing measured heap use from 160 to 288 bytes per instance; region widths are schematic, not physical cache-line boundaries.</desc><defs><marker id="09-storage-layout-dark-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#b0aaa1" stroke-width="1.2"/></marker><marker id="09-storage-layout-dark-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#e09040" stroke-width="1.2"/></marker><marker id="09-storage-layout-dark-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#b0aaa1" stroke-width="1.2"/></marker></defs><rect width="720" height="496" fill="#242834"/><text x="32" y="44" fill="#e4dfd7" font-size="20" font-weight="600" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Adjacent</text>
<text x="688" y="44" fill="#e4dfd7" font-size="20" font-weight="400" text-anchor="end" font-family="Helvetica, Arial, sans-serif">160 B / instance</text>
<text x="32" y="88" fill="#b0aaa1" font-size="20" font-weight="400" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Header</text>
<text x="288" y="88" fill="#b0aaa1" font-size="20" font-weight="400" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Element area</text>
<rect x="32" y="104" width="656" height="64" fill="#242834" stroke="#b0aaa1" stroke-width="1.2"/>
<line x1="288" y1="104" x2="288" y2="168" stroke="#b0aaa1" stroke-width="1.2"/>
<line x1="400" y1="104" x2="400" y2="168" stroke="#b0aaa1" stroke-width="1.2"/>
<text x="160" y="144" fill="#e4dfd7" font-size="20" font-weight="400" text-anchor="middle" font-family="Menlo, Consolas, monospace">State</text>
<text x="344" y="144" fill="#e4dfd7" font-size="20" font-weight="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Lock</text>
<text x="544" y="144" fill="#b0aaa1" font-size="20" font-weight="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">…</text>
<text x="32" y="248" fill="#e4dfd7" font-size="20" font-weight="600" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Padded</text>
<text x="688" y="248" fill="#e4dfd7" font-size="20" font-weight="400" text-anchor="end" font-family="Helvetica, Arial, sans-serif">288 B / instance</text>
<text x="32" y="292" fill="#b0aaa1" font-size="20" font-weight="400" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Header</text>
<text x="288" y="292" fill="#b0aaa1" font-size="20" font-weight="400" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Element area</text>
<rect x="32" y="308" width="656" height="64" fill="#242834" stroke="#b0aaa1" stroke-width="1.2"/>
<line x1="288" y1="308" x2="288" y2="372" stroke="#b0aaa1" stroke-width="1.2"/>
<line x1="576" y1="308" x2="576" y2="372" stroke="#b0aaa1" stroke-width="1.2"/>
<text x="160" y="348" fill="#e4dfd7" font-size="20" font-weight="400" text-anchor="middle" font-family="Menlo, Consolas, monospace">State</text>
<text x="432" y="348" fill="#b0aaa1" font-size="20" font-weight="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">reserved</text>
<text x="632" y="348" fill="#e4dfd7" font-size="20" font-weight="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Lock</text>
<line x1="288" y1="388" x2="288" y2="408" stroke="#e09040" stroke-width="1.2"/>
<line x1="576" y1="388" x2="576" y2="408" stroke="#e09040" stroke-width="1.2"/>
<line x1="288" y1="400" x2="576" y2="400" stroke="#e09040" stroke-width="1.2"/>
<text x="432" y="436" fill="#e09040" font-size="20" font-weight="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">128 B</text>
<text x="432" y="464" fill="#b0aaa1" font-size="20" font-weight="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">from element-area base to lock</text></svg>
